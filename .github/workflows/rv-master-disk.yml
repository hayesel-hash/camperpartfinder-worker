name: RV master catalogue disk worker
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  ingest:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        worker: [discover, acquire, extract-1, extract-2, extract-3, extract-4]
    concurrency:
      group: rv-master-disk-${{ matrix.worker }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify independent database gateway authentication
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += ("&" if "?" in url else "?") + "audience=" + urllib.parse.quote("rv-master-disk-dlijhukwzlqwtmiynncg")
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req, timeout=30) as response:
              token = json.load(response)["value"]
          request = urllib.request.Request("https://dlijhukwzlqwtmiynncg.supabase.co/functions/v1/rv-master-disk-gateway", data=b'{"action":"auth_probe"}', headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"}, method="POST")
          try:
              urllib.request.urlopen(request, timeout=30)
          except urllib.error.HTTPError as e:
              if e.code == 400 and e.read() == b"action":
                  print("OIDC gateway accepted this repository and workflow")
              else:
                  raise RuntimeError("Gateway authentication probe failed: HTTP "+str(e.code)) from None
          else:
              raise RuntimeError("Unexpected gateway probe response")
          PY
      - name: Install pinned Python PDF libraries
        run: |
          python3 -m pip install --disable-pip-version-check PyMuPDF==1.26.5 Pillow==11.3.0
          python3 -c 'import pymupdf; from PIL import Image; print("PDF libraries available")'
      - name: Install OCR tools only when extracting
        if: startsWith(matrix.worker, 'extract-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr gocr poppler-utils
          tesseract --version
          gocr -h >/dev/null 2>&1 || test -x "$(command -v gocr)"
      - name: Test extraction
        run: python3 scripts/rv_master_disk.py --self-test
      - name: Process catalogue queue
        env:
          RV_WORKER: ${{ matrix.worker }}
        run: |
          case "$RV_WORKER" in
            discover) python3 scripts/rv_master_disk.py --discovery-only ;;
            acquire) python3 scripts/rv_master_disk.py --manifest-only ;;
            extract-*) python3 scripts/rv_master_disk.py --batch-only ;;
            *) exit 1 ;;
          esac
