name: CamperMatch runner capacity and factory dispatcher
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rv-runner-capacity.yml'
      - '.github/workflows/rv-master-disk.yml'
      - 'scripts/rv_master_disk.py'
      - 'scripts/catalogue_relationship_extractor.py'
      - 'scripts/reimo_remote_extractor.py'
permissions:
  actions: write
  contents: read
concurrency:
  group: rv-factory-capacity-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch full factory only if a runner was allocated
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # We have reached a real runner. Do not launch another six-job
          # matrix while an earlier matrix remains active or waiting.
          running="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rv-master-disk.yml --status in_progress --limit 2 --json databaseId --jq 'length')"
          queued="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rv-master-disk.yml --status queued --limit 2 --json databaseId --jq 'length')"
          waiting="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rv-master-disk.yml --status waiting --limit 2 --json databaseId --jq 'length' || echo 0)"
          echo "Running: $running; queued: $queued; waiting: $waiting"
          if [[ "$running" == "0" && "$queued" == "0" && "$waiting" == "0" ]]; then
            # Do not automatically launch a fresh matrix after an unverified
            # failure. The classifier requires runner and executed-step evidence.
            latest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rv-master-disk.yml --limit 1 --json databaseId,conclusion,status)"
            latest_id="$(jq -r '.[0].databaseId // empty' <<< "$latest")"
            latest_conclusion="$(jq -r '.[0].conclusion // empty' <<< "$latest")"
            if [[ -n "$latest_id" && "$latest_conclusion" != "success" ]]; then
              echo "Prior matrix $latest_id concluded $latest_conclusion; no unbounded redispatch"
              # Fetch job evidence for a precise classification, but never treat
              # runner execution alone as authorization for another workflow.
              jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$latest_id/jobs?per_page=100" --jq '.jobs[]' | jq -s '.')" || {
                echo "BLOCKED: unable to inspect prior job evidence. No dispatch."
                exit 0
              }
              classification="$(JOBS_JSON="$jobs" python -c 'import json,os; from runner_circuit_breaker import classify_jobs; print(classify_jobs(json.loads(os.environ["JOBS_JSON"])))')" || {
                echo "BLOCKED: job classification failed. No dispatch."
                exit 0
              }
              # A corrected, independently regression-tested commit is not an
              # unbounded retry of the same broken matrix. Permit one new run
              # per code SHA only after the previous failure executed on a runner.
              # If it fails, the SHA becomes the last failed SHA and the
              # ordinary fail-safe immediately stops subsequent redispatch.
              previous_sha="$(gh run view "$latest_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
              if [[ "$classification" == "runner_executed" && "$previous_sha" != "$GITHUB_SHA" ]]; then
                # Push can start this dispatcher before its own regression
                # workflow is finished; wait a bounded 60 seconds rather than
                # leaving a repaired factory stalled until GitHub's next cron.
                passed=0
                for attempt in $(seq 1 12); do
                  passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow reimo-extractor-test.yml --limit 12 --json headSha,status,conclusion | jq --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | length')"
                  [[ "$passed" -ge 1 ]] && break
                  sleep 5
                done
                if [[ "$passed" -ge 1 ]]; then
                  echo "Previous run failed on a different code revision; current SHA passed the full regression suite. Dispatching one bounded recovery matrix."
                  gh workflow run rv-master-disk.yml --repo "$GITHUB_REPOSITORY" --ref main
                  exit 0
                fi
                echo "Previous code failed; waiting for a successful regression test of the current commit."
              fi
              echo "BLOCKED: previous matrix $latest_id: $classification"
              echo "No retry on the same failed commit; check billing/runner availability for pre-provisioning failures."
              exit 0
            fi
            gh workflow run rv-master-disk.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "Previous worker matrix still active; no duplicate dispatch"
          fi
