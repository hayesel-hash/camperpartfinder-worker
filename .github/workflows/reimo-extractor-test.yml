name: Reimo dedicated extractor regression
on:
  push:
    paths:
      - scripts/reimo_remote_extractor.py
      - scripts/rv_master_disk.py
      - .github/workflows/reimo-extractor-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install PDF parser
        run: python3 -m pip install --disable-pip-version-check PyMuPDF==1.26.5 Pillow==11.3.0
      - name: Test Reimo catalogue extractor
        run: python3 scripts/reimo_remote_extractor.py
      - name: Run full ingestion regression suite
        run: python3 scripts/rv_master_disk.py --self-test
