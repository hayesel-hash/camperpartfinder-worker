name: Store reader (makers' online parts stores)
# Reads makers' own online parts stores (first: Lippert) and stages page facts
# through rv-store-gateway (stage-only). Publication happens in the database,
# only for a reviewed store and the maker's own brands. Polite: 1.5 s between
# page requests, ~14 minutes per run; robots and host allowlist enforced.
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/store-reader.yml'
      - 'scripts/store_reader.py'
permissions:
  contents: read
  id-token: write
concurrency:
  group: store-reader
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned PDF library (imported by the shared fetch policy)
        run: python3 -m pip install --disable-pip-version-check PyMuPDF==1.26.5
      - name: Self-test
        run: python3 scripts/store_reader.py --self-test
      - name: Read stores
        run: python3 scripts/store_reader.py
